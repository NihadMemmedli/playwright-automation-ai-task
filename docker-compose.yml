services:
  tests:
    build: .
    image: playwright-qa-framework:latest
    environment:
      - BASE_URL=${BASE_URL:-https://qa-practice.netlify.app}
      # ── Self-healing AI ───────────────────────────────────────────
      - AI_HEALING_ENABLED=${AI_HEALING_ENABLED:-false}
      - AI_HEALING_PROVIDER=${AI_HEALING_PROVIDER:-anthropic}
      - AI_HEALING_MODEL=${AI_HEALING_MODEL:-claude-haiku-4-5-20251001}
      - AI_HEALING_MAX_PER_TEST=${AI_HEALING_MAX_PER_TEST:-3}
      - AI_HEALING_MAX_PER_RUN=${AI_HEALING_MAX_PER_RUN:-10}
      # Anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # OpenRouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Ollama — defaults to the sibling `ollama` service below; override to
      # `http://host.docker.internal:11434` to use Ollama running on your host.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CI=true
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
    ipc: host  # required by Chromium for shared memory

  # Opt-in Ollama service. Enable with: `docker compose --profile ollama up -d ollama`
  # Pull a model once it's running:
  #   docker compose exec ollama ollama pull qwen2.5-coder:7b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama_models:
